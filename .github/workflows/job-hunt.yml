name: LinkedIn ilan taraması

on:
  schedule:
    # Her 15 dakikada bir. Tarama 20 anahtar kelimeyle ~3,5 dakika sürüyor;
    # daha sık çalıştırmak turları üst üste bindirir ve LinkedIn'e giden istek
    # sayısını gereksiz artırır. GitHub'ın zamanlayıcısı ayrıca garantili
    # değildir, yoğunken çalışmaları geciktirir.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Bildirim gönderme, sadece bulunanları logla"
        type: boolean
        default: false

concurrency:
  group: job-hunt
  cancel-in-progress: false

permissions:
  contents: write   # görülen ilanların kaydını repoya geri yazmak için

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: İlanları tara ve bildir
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          # config.yaml'da bir aramaya 'recipients_secret' eklediğinde o
          # secret'ı buraya da yazmalısın; GitHub secret'ları kendiliğinden
          # uygulamaya geçirmiyor.
          MARKETING_EMAILS: ${{ secrets.MARKETING_EMAILS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python -m job_hunter \
            --config config.yaml \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Görülen ilanların kaydını sakla
        if: always()
        run: |
          if [[ -z "$(git status --porcelain state/)" ]]; then
            echo "Kayıt dosyasında değişiklik yok."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "chore: görülen ilanların kaydını güncelle [skip ci]"
          for delay in 0 2 4 8; do
            sleep "$delay"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
          done
          echo "Kayıt dosyası push edilemedi." >&2
          exit 1
