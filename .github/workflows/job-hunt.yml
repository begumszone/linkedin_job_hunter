name: LinkedIn ilan taraması

# Tarama, cron-job.org'dan gelen workflow_dispatch istekleriyle 15 dakikada bir
# tetikleniyor (kurulumu README'de). GitHub'ın kendi 'schedule' tetikleyicisi
# bilerek kullanılmıyor: saatlerce hiç çalışmadı, sonra devreye girip ikinci bir
# tetikleyici hâline geldi ve turlar üst üste binmeye başladı.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Bildirim gönderme, sadece bulunanları logla"
        type: boolean
        default: false

concurrency:
  group: job-hunt
  cancel-in-progress: false

permissions:
  contents: write   # görülen ilanların kaydını repoya geri yazmak için

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: İlanları tara ve bildir
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          # config.yaml'da bir aramaya 'recipients_secret' eklediğinde o
          # secret'ı buraya da yazmalısın; GitHub secret'ları kendiliğinden
          # uygulamaya geçirmiyor.
          MARKETING_EMAILS: ${{ secrets.MARKETING_EMAILS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python -m job_hunter \
            --config config.yaml \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Görülen ilanların kaydını sakla
        if: always()
        run: |
          if [[ -z "$(git status --porcelain state/)" ]]; then
            echo "Kayıt dosyasında değişiklik yok."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Bu turun kaydını sakla: aşağıda depoyu uzak sürüme sıfırlayacağız.
          cp state/seen_jobs.json "${RUNNER_TEMP}/mine.json"

          for attempt in 1 2 3 4; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"

            # Başka bir tur bu arada kendi kaydını yazmış olabilir. JSON'u
            # rebase etmek çakışır; iki turun gördüğü ilanların birleşimi ise
            # her zaman doğru cevaptır.
            python scripts/merge_state.py \
              "${RUNNER_TEMP}/mine.json" state/seen_jobs.json state/seen_jobs.json

            if [[ -z "$(git status --porcelain state/)" ]]; then
              echo "Kayıt zaten güncel."
              exit 0
            fi

            git add state/
            git commit -q -m "chore: görülen ilanların kaydını güncelle [skip ci]"
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "Kayıt dosyası push edilemedi." >&2
          exit 1
